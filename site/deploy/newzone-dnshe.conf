# ============================================================
#  newzone-dnshe —— 「雫的域名盒」官网
#
#  域名：dnshe.shizuku.plus          ← 主域名（纯 ASCII，大陆直连可用）
#        dnshe.nekoha.cc.cd          ← cc.cd 整根在大陆被 SNI 阻断，仅境外可用
#        dnshe.xn--z7x21yw6r.icu|.site|.top
#  站根：/www/wwwroot/dnshe.nekoha.cc.cd
#  证书：/etc/letsencrypt/live/newzones（与其他 newzone 站点共用一证）
#
#  静态站，无后端。downloads/ 下放 APK 与 Windows 安装程序。
# ============================================================
server
{
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name dnshe.shizuku.plus dnshe.nekoha.cc.cd dnshe.xn--z7x21yw6r.icu dnshe.xn--z7x21yw6r.site dnshe.xn--z7x21yw6r.top;

    ssl_certificate     /etc/letsencrypt/live/newzones/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newzones/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers on;
    error_page 497 https://$host$request_uri;

    root /www/wwwroot/dnshe.nekoha.cc.cd;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ACME 校验走公共目录，别的站签发证书时也认这里
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/_acme_zones;
        default_type "text/plain";
        allow all;
        try_files $uri =404;
    }

    # 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml application/xml;

    # 图片 / 脚本 / 样式：长缓存
    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # 安装包：不缓存，支持断点续传（大文件下载必需）
    location ^~ /downloads/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Accept-Ranges bytes always;
        sendfile on;
        aio threads;
        output_buffers 4 256k;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件
    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /www/wwwlogs/newzone-dnshe.log;
    error_log  /www/wwwlogs/newzone-dnshe.error.log;
}
